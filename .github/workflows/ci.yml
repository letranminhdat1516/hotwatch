name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is Windows Server 2025; windows-2022 is Server 2022.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: build the agent and the app
        run: go build ./cmd/hotwatch-agent ./cmd/hotwatch
      - name: agent smoke test
        run: go run ./cmd/hotwatch-agent version

  cross:
    name: cross-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [freebsd/amd64, windows/arm64, linux/arm64, darwin/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and build ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go vet ./...
          go build ./...
        env:
          TARGET: ${{ matrix.target }}
